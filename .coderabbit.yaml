# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit은 자동으로 돌지 않는다. 필요할 때 PR 댓글로 직접 부른다.
#   @coderabbitai review        바뀐 부분 리뷰
#   @coderabbitai full review   PR 전체 다시 리뷰
#   @coderabbitai summary       변경 요약
language: ko-KR

reviews:
  auto_review:
    enabled: false          # PR을 열거나 push해도 자동 리뷰하지 않음
  review_status: false      # "자동 리뷰 꺼짐" 같은 상태 댓글도 남기지 않음
  high_level_summary: false # PR 본문·요약 댓글에 자동 요약을 쓰지 않음

chat:
  auto_reply: false         # @coderabbitai로 부를 때만 답함

issue_enrichment:
  planning:
    auto_planning:
      enabled: false        # 이슈 라벨로 구현 계획을 자동 생성하지 않음
