# 저장소 라벨 정의. GitHub에 자동으로 반영되지 않으므로 라벨 화면에서 같은 이름으로 만들거나,
# 아래처럼 gh CLI로 하나씩 만든다 (이미 있으면 --force로 덮어씀).
#   gh label create "area:acc" --color c5def5 --description "계정·스탭·PIN (FR-ACC)" --force
# 영역 이름은 요구사항명세서 1장 「ID 규칙」의 영역 코드와 같다. PR 제목 scope도 같은 값을 쓴다 (예: feat(rsv): …).

# 종류 (이슈 템플릿이 자동으로 붙임)
- name: feature
  color: "1d76db"
  description: "Feature 템플릿. 브랜치·PR type: feat"
- name: bug
  color: "d73a4a"
  description: "Bug 템플릿. 브랜치·PR type: fix"
- name: chore
  color: "cfd3d7"
  description: "Task 템플릿. type: docs, chore, refactor, test 중 맞는 것"

# 우선순위 (요구사항명세서 1장)
- name: "priority:p1"
  color: "b60205"
  description: "MVP 필수"
- name: "priority:p2"
  color: "fbca04"
  description: "MVP 권장"
- name: "priority:p3"
  color: "c2e0c6"
  description: "확장"

# 영역 (요구사항명세서 ID 영역 코드)
- name: "area:acc"
