name: Feature
description: 요구사항명세서의 기능을 구현하는 작업
title: "[Feature] "
labels: ["feature"]
body:
  - type: input
    id: requirement
    attributes:
      label: 관련 요구사항 ID
      description: 요구사항명세서.md의 ID. 여러 개면 쉼표로 구분합니다.
      placeholder: "예: FR-RSV-04, NFR-03"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      description: 요구사항명세서에 적힌 우선순위를 그대로 고릅니다.
      options:
        - P1 (MVP 필수)
        - P2 (MVP 권장)
        - P3 (확장)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 목적 · 문제
      description: 무엇을 해결하려는지 한두 줄로 적습니다.
      placeholder: 같은 스탭의 예약이 겹쳐 저장되어 ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      placeholder: |
        - 포함: ...
        - 제외: ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 요구사항명세서 「상세 / 수용 기준」 열을 조건별로 옮깁니다.
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: policy
    attributes:
      label: 지켜야 할 정책 · 결정
      description: "관련 결정 항목(예: C7, E3), 권한(명세서 2장 기능 키, docs/CONTRACTS.md 「3」), 개인정보·동의 조건 등"
      placeholder: |
        - 권한: RESERVATION (공용, 토글 가능)
        - 결정: C7 겹치는 예약 불가, E3 고객 없는 예약도 겹침 차단에 포함
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 참고 문서
      description: 기획서 장, docs/ARCHITECTURE.md · CONTRACTS.md 절 등
    validations:
      required: false

  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
      description: 완료를 어떻게 확인할지. 테스트, 시드 데이터 시나리오(기획서 7장) 등
    validations:
      required: true
